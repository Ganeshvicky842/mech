<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101a19" />
  <title>Reset administrator password — Wrench &amp; Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="reset-password.css" />
</head>
<body class="password-reset-page">
  <main class="password-reset-card">
    <a class="brand" href="/"><span class="brand-mark">W<span>+</span></span><span class="brand-name">WRENCH<span>&amp; CO.</span></span></a>
    <div class="eyebrow"><span></span> SECURE ACCOUNT RECOVERY</div>
    <h1>Choose a new <em>password.</em></h1>
    <p class="reset-intro">Set a new password for your workshop administrator account.</p>
    <form id="reset-password-form">
      <label>New password<input type="password" name="password" minlength="12" maxlength="200" autocomplete="new-password" required /></label>
      <label>Confirm new password<input type="password" name="confirmPassword" minlength="12" maxlength="200" autocomplete="new-password" required /></label>
      <p class="password-hint">Use at least 12 characters. This reset link can only be used once and expires after 30 minutes.</p>
      <p class="reset-message" id="reset-message" role="status" aria-live="polite"></p>
      <button class="button button-primary" type="submit">Update password <span>↗</span></button>
    </form>
    <a class="reset-back-link" href="/">Return to Wrench &amp; Co.</a>
  </main>
  <script src="api.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
